# The runtime includes conf.d files inside its http block.
log_format taskbot '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    access_log /var/log/nginx/access.log taskbot;
    include /etc/nginx/conf.d/nginx-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/events {
        set $api_upstream api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$api_upstream;
    }

    location /api/ {
        client_max_body_size 64k;
        set $api_upstream api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$api_upstream;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/nginx-headers.conf;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/nginx-headers.conf;
    }

    location / {
        try_files $uri /index.html;
    }

    location = /favicon.ico {
        return 204;
    }
}

name: ${TASKBOT_STACK:-taskbot}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: taskbot
      POSTGRES_PASSWORD: taskbot
      POSTGRES_DB: taskbot
    ports:
      - "127.0.0.1:${TASKBOT_PG_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  redis:
    image: redis:8
    ports:
      - "127.0.0.1:${TASKBOT_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres-data:
  redis-data:

[project]
name = "taskbot"
version = "0.1.0"
description = "A Telegram task bot and dashboard API"
requires-python = ">=3.14,<3.15"
dependencies = [
  "aiogram>=3.31.0",
  "alembic>=1.20.1",
  "anthropic>=2.3,<3",
  "asyncpg>=0.32.0",
  "celery[redis]>=5.6.3,<5.7",
  "fastapi>=0.162.0",
  "httpx>=0.28.1",
  "openai>=3.37,<4",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.16.1",
  "redis>=5,<6.5",
  "sqlalchemy[asyncio]>=2.1.6",
  "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "asyncpg-stubs>=0.32.0",
  "import-linter>=2.15",
  "mypy>=2.4",
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "ruff>=0.17",
]

[tool.uv]
required-version = ">=0.13"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "ASYNC", "SIM", "PT", "RUF", "C901", "PLR0912", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 40

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["integration: requires local PostgreSQL and Redis; never silently skipped"]

[tool.importlinter]
root_package = "taskbot"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
layers = ["taskbot.entrypoints", "taskbot.application | taskbot.infrastructure", "taskbot.domain"]

[[tool.importlinter.contracts]]
name = "no sdk in the core"
type = "forbidden"
source_modules = ["taskbot.domain", "taskbot.application"]
forbidden_modules = ["aiogram", "anthropic", "openai", "celery", "kombu", "redis", "sqlalchemy", "asyncpg", "alembic", "fastapi", "starlette", "httpx", "httpx2"]
